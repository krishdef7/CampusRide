# `docker compose up -d db` is all the core platform needs.
# `docker compose --profile obs up -d` adds Prometheus, Grafana and Jaeger.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: campusride
      POSTGRES_PASSWORD: campusride
      POSTGRES_DB: campusride
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=on", "-c", "track_commit_timestamp=on"]
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusride"]
      interval: 2s
      retries: 30

  # Reference API deployment for load tests (Linux, uvloop + httptools, 4 workers).
  api:
    profiles: [load]
    build: .
    environment:
      DATABASE_URL: postgresql://campusride:campusride@db:5432/campusride_load
      LLM_PROVIDER: none
      LOG_LEVEL: WARNING
      DB_POOL_MIN: "5"
      DB_POOL_MAX: "20"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    command: >
      sh -c "rm -rf /tmp/prom && mkdir -p /tmp/prom &&
             uvicorn campusride.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4}
             --loop uvloop --http httptools --no-access-log --log-level warning"
    depends_on:
      db: {condition: service_healthy}
    ports: ["8001:8000"]

  loadtest:
    profiles: [load]
    build: .
    environment:
      LOAD_DATABASE_URL: postgresql://campusride:campusride@db:5432/campusride_load
      LOADTEST_WHERE: "API, Postgres and load generator in Docker (Linux containers, Docker Desktop / WSL2)"
      API_DESC: "uvicorn x${API_WORKERS:-4} workers, uvloop + httptools, asyncpg pool 20/worker"
      HOST_CPU: ${HOST_CPU:-unknown}
    volumes: ["./loadtest/reports:/app/loadtest/reports"]
    depends_on:
      db: {condition: service_healthy}
    entrypoint: ["python", "loadtest/run_loadtest.py", "--base-url", "http://api:8000"]

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.55.1
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]

  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

volumes:
  pgdata:
